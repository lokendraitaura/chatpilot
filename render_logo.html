<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    #container { width: 512px; height: 512px; }
    svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="container">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="50" fill="#25D366" />
      <path d="M 50 22 C 65.5 22 78 34.5 78 50 C 78 65.5 65.5 78 50 78 C 43 78 36.5 75.5 31.5 71 L 18 76 L 22.5 63 C 18.5 58.5 16 52.5 16 46 C 16 32.7 31.2 22 50 22 Z" fill="#FFFFFF" />
      <path d="M 54 38 L 86 14 L 62 46 Z" fill="#128C7E" />
    </svg>
  </div>
  <canvas id="canvas" width="512" height="512"></canvas>
  <script>
    window.onload = function() {
      const svg = document.querySelector('svg');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      const svgData = new XMLSerializer().serializeToString(svg);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      
      img.onload = function() {
        ctx.drawImage(img, 0, 0, 512, 512);
        const base64 = canvas.toDataURL('image/png');
        window.logoBase64 = base64;
        console.log('LOGO_READY');
      };
      img.src = url;
    };
  </script>
</body>
</html>
